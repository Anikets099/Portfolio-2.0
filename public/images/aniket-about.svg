<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="100%" height="100%">
  <defs>
    <!-- Background Moody Glow -->
    <radialGradient id="redRimGlow" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7DD3FC" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06141B" stop-opacity="0"/>
    </radialGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Lapel Highlight -->
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Skin Tone Shadow -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="70%" stop-color="#9C6644"/>
      <stop offset="100%" stop-color="#58311B"/>
    </linearGradient>

    <!-- Sunglasses Tint -->
    <linearGradient id="shadesGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Bottom Fade Mask for seamless blending into dark section -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="78%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="96%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="600" height="1100" fill="url(#bottomFade)" />
    </mask>
  </defs>

  <g mask="url(#fadeMask)">
    <!-- Back Rim Light Aura -->
    <ellipse cx="300" cy="460" rx="220" ry="380" fill="url(#redRimGlow)"/>

    <!-- Red Edge Laser Accent line -->
    <path d="M 170 300 Q 150 480 180 750 Q 210 980 230 1060" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 8"/>

    <!-- Silhouette / Standing Figure -->
    <!-- Shoes -->
    <g id="shoes">
      <!-- Left Shoe -->
      <path d="M 210 1020 L 260 1020 L 275 1045 L 205 1050 L 175 1045 Z" fill="#030508"/>
      <path d="M 175 1045 Q 210 1050 255 1048 L 270 1040 Q 240 1032 205 1030 Z" fill="#1E293B" opacity="0.4"/>
      <!-- Right Shoe -->
      <path d="M 335 1020 L 385 1020 L 415 1045 L 345 1050 L 320 1045 Z" fill="#030508"/>
      <path d="M 320 1045 Q 355 1050 395 1048 L 410 1040 Q 380 1032 345 1030 Z" fill="#1E293B" opacity="0.4"/>
    </g>

    <!-- Trousers -->
    <g id="pants">
      <!-- Left Leg -->
      <path d="M 235 600 L 285 600 L 265 1020 L 210 1020 Z" fill="url(#suitGrad)"/>
      <path d="M 235 600 L 245 780 L 235 1020" stroke="#000" stroke-width="2" opacity="0.6"/>
      <!-- Crease highlight -->
      <path d="M 252 640 L 248 980" stroke="#334155" stroke-width="1.2" opacity="0.35"/>

      <!-- Right Leg -->
      <path d="M 295 600 L 345 600 L 380 1020 L 330 1020 Z" fill="url(#suitGrad)"/>
      <path d="M 345 600 L 355 780 L 360 1020" stroke="#000" stroke-width="2" opacity="0.6"/>
      <!-- Crease highlight -->
      <path d="M 342 640 L 350 980" stroke="#334155" stroke-width="1.2" opacity="0.35"/>

      <!-- Belt & Buckle -->
      <rect x="245" y="585" width="105" height="16" fill="#090D16" rx="2"/>
      <rect x="288" y="583" width="20" height="20" fill="none" stroke="#64748B" stroke-width="2" rx="2"/>
    </g>

    <!-- Suit Jacket & Torso -->
    <g id="jacket">
      <!-- Main body jacket -->
      <path d="M 215 320 L 375 320 L 405 530 L 390 680 L 200 680 L 185 530 Z" fill="url(#suitGrad)"/>

      <!-- Left Lapel -->
      <path d="M 245 320 L 290 530 L 265 530 L 210 400 Z" fill="url(#lapelGrad)"/>
      <!-- Right Lapel -->
      <path d="M 345 320 L 300 530 L 325 530 L 380 400 Z" fill="url(#lapelGrad)"/>

      <!-- Inner Black Shirt -->
      <path d="M 265 320 L 325 320 L 300 520 L 290 520 Z" fill="#070A0F"/>
      <!-- Collar V -->
      <path d="M 270 300 L 295 360 L 320 300 Z" fill="#0F172A"/>

      <!-- Left Arm -->
      <path d="M 215 320 L 180 500 L 195 650 L 230 635 L 215 480 L 235 340 Z" fill="url(#suitGrad)"/>
      <!-- Right Arm -->
      <path d="M 375 320 L 410 500 L 395 650 L 360 635 L 375 480 L 355 340 Z" fill="url(#suitGrad)"/>

      <!-- Left Hand -->
      <path d="M 195 650 Q 185 690 198 715 Q 210 720 220 700 L 225 640 Z" fill="url(#skinGrad)"/>
      <!-- Wrist watch on left hand -->
      <rect x="195" y="642" width="26" height="8" rx="2" fill="#090D16"/>
      <circle cx="208" cy="646" r="5" fill="#334155" stroke="#94A3B8" stroke-width="1"/>

      <!-- Right Hand -->
      <path d="M 395 650 Q 405 690 392 715 Q 380 720 370 700 L 365 640 Z" fill="url(#skinGrad)"/>
    </g>

    <!-- Head & Neck -->
    <g id="head">
      <!-- Neck -->
      <path d="M 275 250 L 315 250 L 320 320 L 270 320 Z" fill="url(#skinGrad)"/>

      <!-- Jaw / Face -->
      <path d="M 260 210 Q 255 260 295 285 Q 335 260 330 210 Q 330 160 295 160 Q 260 160 260 210 Z" fill="url(#skinGrad)"/>

      <!-- Hair (modern textured undercut / styled volume) -->
      <path d="M 252 205 Q 245 160 280 140 Q 320 135 338 155 Q 345 180 340 210 Q 335 185 320 175 Q 300 160 280 170 Q 260 185 252 205 Z" fill="#080C14"/>
      <!-- Strands highlight -->
      <path d="M 265 170 Q 285 150 315 152" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

      <!-- Modern Dark Sunglasses -->
      <!-- Left Lens Frame -->
      <rect x="260" y="200" width="32" height="20" rx="3" fill="url(#shadesGrad)" stroke="#090D16" stroke-width="1.8"/>
      <!-- Bridge -->
      <rect x="290" y="204" width="10" height="4" fill="#090D16"/>
      <!-- Right Lens Frame -->
      <rect x="298" y="200" width="32" height="20" rx="3" fill="url(#shadesGrad)" stroke="#090D16" stroke-width="1.8"/>
      <!-- Lens Reflections -->
      <path d="M 264 204 L 278 204 L 268 216 L 262 216 Z" fill="#7DD3FC" opacity="0.35"/>
      <path d="M 302 204 L 316 204 L 306 216 L 300 216 Z" fill="#7DD3FC" opacity="0.35"/>

      <!-- Subtle Smile / Firm Expression -->
      <path d="M 285 255 Q 295 260 305 255" fill="none" stroke="#3A1C0E" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Subtle Red Rim Lighting along body silhouettes -->
    <path d="M 215 320 L 180 500 L 195 650" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.55"/>
    <path d="M 252 205 Q 245 160 280 140" fill="none" stroke="#EF4444" stroke-width="1.8" opacity="0.75"/>
    <path d="M 340 210 Q 345 180 338 155" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
